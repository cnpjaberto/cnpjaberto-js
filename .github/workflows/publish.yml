name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publica no NPM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Instala dependências
        run: npm ci

      - name: Valida SDK e MCP
        run: npm test

      - name: Publica com provenance OIDC
        run: npm publish --provenance --access public
